      normal: { id: "B20261028", state: "normal", status: "正常", expiry: "2026-12-08", note: "距效期约 57 天", quantity: "10 瓶", marker: "✓" }
    };
    const requested = new URLSearchParams(location.search).get("state") || "near";
    let state = examples[requested] ? requested : "near";
    let expanded = requested === "expanded";
    const card = document.getElementById("batchCard");
    const collapsed = document.getElementById("collapsedContent");
    const expandedContent = document.getElementById("expandedContent");
    function renderRows() {
      document.getElementById("batchRows").innerHTML = batches.map(batch => `<article class="batch-row ${batch.state}">
        <div class="row-first"><strong class="row-id">${batch.id}</strong><span class="row-chip">${batch.status}</span></div>
        <div class="row-second"><span>效期</span><strong class="row-date">${batch.expiry}</strong><span class="row-note">${batch.note}</span></div>
        <div class="row-third"><strong class="row-quantity">可用 ${batch.quantity}</strong><span class="row-location">${batch.location}</span></div>
      </article>`).join("");
    }
    function render() {
      const sample = examples[state];
      card.classList.remove("near", "priority", "normal", "expanded");
      card.classList.add(sample.state);
      if (expanded) card.classList.add("expanded");
      collapsed.hidden = expanded;
      expandedContent.hidden = !expanded;
      document.getElementById("batchId").textContent = sample.id;
      document.getElementById("expiry").textContent = sample.expiry;
      document.getElementById("expiryNote").textContent = sample.note;
      document.getElementById("quantity").textContent = sample.quantity;
      document.getElementById("statusMark").textContent = sample.marker;
      document.getElementById("statusLabel").textContent = sample.status;
      document.getElementById("flowHeading").style.top = expanded ? "785px" : "624px";
      document.getElementById("flowCard").style.top = expanded ? "822px" : "661px";
      document.getElementById("expandButton").setAttribute("aria-expanded", String(expanded));
      renderRows();
    }
    document.getElementById("expandButton").addEventListener("click", () => { expanded = true; render(); });
    document.getElementById("collapseButton").addEventListener("click", () => { expanded = false; render(); });
    render();
  </script>
</body>
</html>
